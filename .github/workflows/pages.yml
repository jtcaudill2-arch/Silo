name: Deploy to GitHub Pages

# Publishes the playable game to a real HTTPS URL so a phone can just open it,
# with no laptop serving on the LAN.
#
# The site is served from a project subpath (https://<user>.github.io/Silo/),
# which is why every path in the game is relative — `test/mobile.mjs` runs the
# whole game from that subpath to keep it that way.

on:
  push:
    branches: [claude/deepwater-game-design-5pml4z, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the game has zero runtime dependencies and the build
      # only copies and verifies. (There is no lockfile to `npm ci` from.)
      - name: Assemble dist/
        run: node tools/build-site.mjs

      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it isn't already, so this works
          # without a trip to the settings page — where permitted. The
          # workflow token cannot create a Pages site for a private repo on a
          # plan without Pages for private repositories; see below.
          enablement: true

      # `Resource not accessible by integration` from the step above is a
      # permission answer, not a bug in this workflow. Say so plainly rather
      # than leaving a red X and an API doc link.
      - if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled for this repository::"
          echo "The site built fine — only publishing failed."
          echo
          echo "Fix it with one of:"
          echo "  1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions."
          echo "  2. If that option is absent, this is a private repository on a plan"
          echo "     without Pages for private repos. Make the repository public"
          echo "     (Settings -> General -> Danger Zone) or upgrade the account."
          echo
          echo "Then re-run this workflow. Until then the game is still playable over"
          echo "Wi-Fi from your own machine: npm run serve, and open the LAN address"
          echo "it prints on your phone."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
