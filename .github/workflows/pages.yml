name: Deploy to GitHub Pages

# Publishes the playable game to a real HTTPS URL so a phone can just open it,
# with no laptop serving on the LAN.
#
# The site is served from a project subpath (https://<user>.github.io/Silo/),
# which is why every path in the game is relative — `test/mobile.mjs` runs the
# whole game from that subpath to keep it that way.

# PREVIEW BRANCH — REVERT BEFORE MERGING.
#
# `claude/deepwater-abandoned-silo-wip` is here so the game can be played on a
# phone before its balance is finished, which is the only way to find out
# whether the design is right before spending days tuning it. Its gate below is
# the playability pair rather than the whole suite, and that difference is the
# entire reason this block is temporary: the long-run suites — obedient,
# harness, pacing — are RED on that branch and the silo dies on day 78.
#
# Pages serves one site, so a push here replaces whatever is live at the URL.
on:
  push:
    branches: [claude/deepwater-game-design-5pml4z, main, claude/deepwater-abandoned-silo-wip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The suite, first, and the deploy waits on it. Until this existed nothing in
  # the repository ran `npm test`: every push published straight to Pages with
  # no assertion having executed anywhere, which is a strange thing for a
  # project that mutation-tests its own tests.
  test:
    if: github.ref_name != 'claude/deepwater-abandoned-silo-wip'
    uses: ./.github/workflows/test.yml

  # The preview gate: does it boot, play, and work offline from the subpath on a
  # phone. It proves the thing is worth looking at; it does not prove the silo
  # survives, and on the preview branch it does not.
  preview-playable:
    if: github.ref_name == 'claude/deepwater-abandoned-silo-wip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - run: node test/mobile.mjs

  build:
    needs: [test, preview-playable]
    # `needs` on a skipped job is "skipped", which would block the build on both
    # branches. Only the gate that actually ran has to have succeeded.
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the game has zero runtime dependencies and the build
      # only copies and verifies. (There is no lockfile to `npm ci` from.)
      - name: Assemble dist/
        run: node tools/build-site.mjs

      # No `enablement: true`. Creating a Pages site is an admin operation and
      # GITHUB_TOKEN is not an admin token, so that flag fails with
      # `Resource not accessible by integration` however the repository is
      # configured — it needs a PAT. Pages is enabled once, by hand; after
      # that this step finds the site and every later run is automatic.
      - id: pages
        uses: actions/configure-pages@v5

      - if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages has not been enabled yet::"
          echo "The site built fine — only publishing failed."
          echo
          echo "Enable it once, by hand:"
          echo "  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          echo
          echo "Then re-run this workflow. It is a one-time step; nothing after it"
          echo "needs a human. Until then the game is still playable over Wi-Fi:"
          echo "npm run serve, then open the LAN address it prints on your phone."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
